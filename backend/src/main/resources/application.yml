server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: ai-multi-agent-travel-planner
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:travel_planner;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  ai:
    provider: ${AI_PROVIDER:MOCK_HYBRID} # MOCK_HYBRID allows live GEMINI if key exists, otherwise rich intelligent fallback
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      endpoint: https://generativelanguage.googleapis.com/v1beta/models
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.1}
  integrations:
    openweather:
      api-key: ${OPENWEATHER_API_KEY:}
    amadeus:
      api-key: ${AMADEUS_API_KEY:}
      api-secret: ${AMADEUS_API_SECRET:}
    mapbox:
      access-token: ${MAPBOX_ACCESS_TOKEN:pk.eyJ1IjoidHJhdmVscGxhbm5lciIsImEiOiJjbHNmYWJjMTIwMDAwMm1xdGZ6eG9hYmNlIn0.mocktoken}
    google-places:
      api-key: ${GOOGLE_PLACES_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
