services:
  # PostgreSQL with pgvector extension for RAG embeddings
  postgres:
    image: pgvector/pgvector:pg16
    container_name: travelplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelplanner
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: travelpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveluser -d travelplanner"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelplanner-net

  # Redis for session cache, agent locks and rate limits
  redis:
    image: redis:7-alpine
    container_name: travelplanner-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelplanner-net

  # Spring Boot Backend
  backend:
    image: travelplanner-backend:latest
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: travelplanner-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travelplanner
      SPRING_DATASOURCE_USERNAME: traveluser
      SPRING_DATASOURCE_PASSWORD: travelpassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-TravelPlannerSuperSecretJwtSigningKeyMustBe256BitsLong2026!}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelplanner-net

  # Next.js 15 Frontend
  frontend:
    image: travelplanner-frontend:latest
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: travelplanner-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:8081/api
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - travelplanner-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: travelplanner-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - travelplanner-net

volumes:
  postgres_data:
  redis_data:

networks:
  travelplanner-net:
    driver: bridge
